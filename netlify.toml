# Netlify hosts the React frontend only. The FastAPI backend stays on Render, and
# Netlify forwards /api/* to it so the browser sees a single origin (no CORS, and
# the Google sign-in redirect "/#vulnex_token=..." lands back on this site).
#
# Replace the Render hostname below if your service URL differs from
# https://vulnex.onrender.com (see the service's URL in the Render dashboard).

[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://vulnex.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: hash routes need only index.html, but serve it for any other path too.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
