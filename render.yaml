# Render Blueprint — live Vulnex console with React UI and the .NET API.
#
# One Docker service (see ./Dockerfile): the ASP.NET Core API serves the Vite-built React
# interface, and the Python engine (scanner, enrichment) runs beside it as a subprocess.
# Data: with DATABASE_URL set (Supabase Postgres) triage comments, disputes and PR
# links persist across deploys; without it the app falls back to the SQLite snapshot
# in the repo, which resets on every deploy. Render free instances may sleep while idle.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file and prompts for Google OAuth credentials (marked `sync: false`).
# Create a Google OAuth client whose callback is exactly
#   https://<your-service>.onrender.com/api/auth/google/callback
services:
  - type: web
    name: vulnex
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      # Google is the only admin sign-in method. Set the OAuth client's callback to
      # this service's /api/auth/google/callback.
      - key: VULNEX_ADMIN_EMAIL
        value: gurujuakhila.dev@gmail.com
      # Supabase connection string (Session pooler). Secret: set it in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Developers who may sign in with Google (comma separated emails): GitHub PR, comments and
      # disputes. Leave empty for admin-only sign-in.
      - key: VULNEX_DEVELOPER_EMAILS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
