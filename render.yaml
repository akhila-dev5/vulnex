# Render Blueprint — live Vulnex console with React UI and FastAPI API.
#
# One FastAPI/uvicorn process serves the API and the Vite-built React interface.
# The current database stays the existing SQLite snapshot; this PR does not migrate
# persistence to managed PostgreSQL. Render free instances may sleep while idle.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file and prompts for Google OAuth credentials (marked `sync: false`).
# Create a Google OAuth client whose callback is exactly
#   https://<your-service>.onrender.com/api/auth/google/callback
services:
  - type: web
    name: vulnex
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn vulnex.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Google is the only admin sign-in method. Set the OAuth client's callback to
      # this service's /api/auth/google/callback.
      - key: VULNEX_ADMIN_EMAIL
        value: gurujuakhila.dev@gmail.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
