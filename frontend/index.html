<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VULNEX — Azure Linux CVE Intelligence</title>
    <meta
      name="description"
      content="VULNEX is an open-source Azure Linux CVE scanner: it reads real RPM specs, matches vulnerabilities with version-range logic and verifies distro backports."
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v9c0 7 5 12 12 14 7-2 12-7 12-14V7z' fill='%230b1220' stroke='%2322d3ee' stroke-width='2'/%3E%3Cpath d='M11 16l4 4 7-8' fill='none' stroke='%2334d399' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="scanline" aria-hidden="true"></div>
    <div id="app">
      <aside class="sidebar">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="30" height="30">
              <path d="M16 2 4 7v9c0 7 5 12 12 14 7-2 12-7 12-14V7z" fill="#0b1220" stroke="#22d3ee" stroke-width="2" />
              <path d="M11 16l4 4 7-8" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="brand-text">
            <strong>VULNEX</strong>
            <small>Azure Linux CVE Intelligence</small>
          </span>
        </a>

        <nav class="nav" id="nav">
          <a href="#/" data-route="dashboard"><span class="dot"></span>Dashboard</a>
          <a href="#/affected" data-route="affected"><span class="dot"></span>Affected</a>
          <a href="#/patched" data-route="patched"><span class="dot"></span>Already Patched</a>
          <a href="#/cves" data-route="cves"><span class="dot"></span>All CVEs</a>
          <a href="#/packages" data-route="packages"><span class="dot"></span>Packages</a>
          <a href="#/assignments" data-route="assignments"><span class="dot"></span>Patch Queue</a>
          <a href="#/scan" data-route="scan"><span class="dot"></span>Scan</a>
          <a href="#/about" data-route="about"><span class="dot"></span>Methodology</a>
        </nav>

        <div class="sidebar-foot">
          <div class="pill" id="repo-pill">akhila-dev5/azurelinux-test</div>
          <div class="muted" id="branch-pill">—</div>
          <div class="muted small" id="version-pill">v1.0.0</div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="btn btn-ghost btn-sm nav-toggle" id="nav-toggle" aria-label="Toggle navigation">☰</button>
          <div class="topbar-title">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-sub" class="muted">Azure Linux vulnerability posture</p>
          </div>
          <div class="topbar-actions">
            <div class="last-scan" id="last-scan">No scan yet</div>
            <button class="btn btn-primary" id="scan-now">Scan&nbsp;Now</button>
          </div>
        </header>
        <main id="view" class="view">
          <div class="loading">Loading VULNEX…</div>
        </main>
      </div>
    </div>

    <div class="drawer-backdrop" id="backdrop" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
