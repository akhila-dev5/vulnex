name: Vulnex CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vulnex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run backend tests (SQLite)
        working-directory: backend
        run: pytest -q
      - name: Run backend tests (PostgreSQL)
        working-directory: backend
        env:
          VULNEX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vulnex_test
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Type-check and build React dashboard
        working-directory: frontend
        run: npm run build

  dotnet-api:
    # The .NET API: unit tests, then a contract check that it answers exactly like the
    # Python API when both run against the same PostgreSQL database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vulnex_contract
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vulnex_contract
      VULNEX_AUTOMATION_KEY: ci-automation-key
      VULNEX_SEED_SNAPSHOT: "0"
      VULNEX_PYTHON: python
      VULNEX_BACKEND_DIR: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and unit-test the .NET API
        run: |
          dotnet build api/Vulnex.sln -c Release
          dotnet test api/Vulnex.sln -c Release --no-build
      - name: Install the Python engine
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Create the schema (Alembic) and start both APIs
        run: |
          (cd backend && python -m vulnex.engine_bridge migrate)
          (cd backend && nohup python -m uvicorn vulnex.api:app --port 8001 > /tmp/python-api.log 2>&1 &)
          (PORT=8002 nohup dotnet api/Vulnex.Api/bin/Release/net10.0/Vulnex.Api.dll > /tmp/dotnet-api.log 2>&1 &)
          for i in $(seq 1 40); do
            curl -sf localhost:8001/api/health >/dev/null && curl -sf localhost:8002/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "servers did not start"; tail -30 /tmp/python-api.log /tmp/dotnet-api.log; exit 1
      - name: Contract check (Python vs .NET)
        run: python scripts/contract_check.py --python http://127.0.0.1:8001 --dotnet http://127.0.0.1:8002
      - name: Server logs
        if: failure()
        run: tail -60 /tmp/python-api.log /tmp/dotnet-api.log
