name: Vulnex CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vulnex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run backend tests (SQLite)
        working-directory: backend
        run: pytest -q
      - name: Run backend tests (PostgreSQL)
        working-directory: backend
        env:
          VULNEX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vulnex_test
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Type-check and build React dashboard
        working-directory: frontend
        run: npm run build

  dotnet-api:
    # The .NET API: unit tests, then integration tests against a seeded PostgreSQL database
    # (golden answers recorded from the original Python API, plus the write workflows).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vulnex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vulnex_test
      VULNEX_PYTHON: python
      VULNEX_BACKEND_DIR: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the Python engine
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Create the schema and the test rows
        run: |
          (cd backend && VULNEX_SEED_SNAPSHOT=0 python -m vulnex.engine_bridge migrate)
          python scripts/api_snapshots.py seed
      - name: Build the .NET API
        run: dotnet build api/Vulnex.sln -c Release
      - name: Unit tests and golden answers (read endpoints)
        run: dotnet test api/Vulnex.sln -c Release --no-build --filter "Suite!=Workflow"
      - name: Workflow tests (writes, roles, automation)
        # Before each test empties the tables, the Python checker reads what the previous test wrote.
        env:
          VULNEX_CHECK_SHARED_DATA: "1"
        run: dotnet test api/Vulnex.sln -c Release --no-build --filter "Suite=Workflow"
      - name: Python can read everything the .NET API wrote (final state)
        run: python scripts/check_shared_data.py

  docker-image:
    # Builds the image Render deploys and starts it, so a missing file, dependency or
    # executable bit shows up here and not on the deploy.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vulnex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t vulnex-api:ci .
      - name: Start it against an empty database and check /api/health
        run: |
          docker run -d --name vulnex --network host \
            -e PORT=8080 -e VULNEX_SEED_SNAPSHOT=0 \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/vulnex_test \
            vulnex-api:ci
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8080/api/health || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          cat /tmp/health.json; echo
          if [ "$code" != "200" ]; then docker logs vulnex; exit 1; fi
          grep -q '"schema"' /tmp/health.json
      - name: A failing migration must stop the container
        run: |
          docker rm -f vulnex >/dev/null
          set +e
          # Wrong password: the database answers with an error, so the entrypoint must exit 1.
          timeout 120 docker run --rm --network host \
            -e PORT=8081 -e VULNEX_SEED_SNAPSHOT=0 \
            -e DATABASE_URL=postgresql://postgres:wrong@localhost:5432/vulnex_test \
            vulnex-api:ci
          code=$?
          echo "exit code: $code"
          [ "$code" -eq 1 ]
