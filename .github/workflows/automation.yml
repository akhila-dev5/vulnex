name: Vulnex automation

# Works through the requests queued with the Automate button: for each package it patches the
# CVEs and raises ONE draft PR in akhila-dev5/azurelinux-test (and nowhere else).
#
# Secrets and variables (Settings > Secrets and variables > Actions):
#   secret   AZL_TEST_TOKEN          a token created while signed in as the automation GitHub account, able to push
#                                    branches and open PRs in azurelinux-test (see docs/10-automation.md)
#   variable VULNEX_AUTOMATION_GITHUB_LOGIN  the automation account's GitHub username; the token must belong to it
#   secret   VULNEX_AUTOMATION_KEY   the same value as VULNEX_AUTOMATION_KEY on the Render backend
#   variable VULNEX_API_URL          e.g. https://vulnex-1k5h.onrender.com
#   secret   VULNEX_AI_API_KEY       optional; without it the built-in GITHUB_TOKEN uses GitHub Models (free)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything except push and open the PR"
        type: boolean
        default: false

permissions:
  contents: read
  models: read

concurrency:
  group: vulnex-automation
  cancel-in-progress: false

jobs:
  patch:
    name: Patch queued packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd unzip patch
        working-directory: backend
      - name: Work through the queue
        working-directory: backend
        env:
          VULNEX_API_URL: ${{ vars.VULNEX_API_URL }}
          VULNEX_AUTOMATION_KEY: ${{ secrets.VULNEX_AUTOMATION_KEY }}
          AZL_TEST_TOKEN: ${{ secrets.AZL_TEST_TOKEN }}
          VULNEX_AUTOMATION_GITHUB_LOGIN: ${{ vars.VULNEX_AUTOMATION_GITHUB_LOGIN }}
          VULNEX_AI_API_KEY: ${{ secrets.VULNEX_AI_API_KEY }}
          VULNEX_AI_BASE_URL: ${{ vars.VULNEX_AI_BASE_URL }}
          VULNEX_AI_MODEL: ${{ vars.VULNEX_AI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m vulnex.automation ${{ inputs.dry_run && '--dry-run' || '' }}
