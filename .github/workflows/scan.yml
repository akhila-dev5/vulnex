name: Vulnex scan

# Runs on a schedule, on demand, and never on a bot push (the snapshot commit is
# marked [skip ci]) so the workflow cannot loop on itself.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      branches:
        description: "Stable branches from akhila-dev5/azurelinux-test (3.0 and/or 4.0 only)"
        default: "3.0,4.0"
      enrich_limit:
        description: "Max CVEs to enrich from NVD/MITRE/Red Hat/GHSA"
        default: "5000"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vulnex-scan
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run scanner tests
        run: python -m pytest -q
        working-directory: backend

  scan:
    name: Scan azurelinux-test fork
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_DB: ${{ secrets.DATABASE_URL != '' }}
      HAS_VULNDATA_TOKEN: ${{ secrets.VULNEX_VULNDATA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run VULNEX scan
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          VULNEX_REPO_OWNER: akhila-dev5
          VULNEX_REPO_NAME: azurelinux-test
          VULNEX_BRANCHES: ${{ github.event.inputs.branches || '3.0,4.0' }}
        run: |
          python -m vulnex.cli scan \
            --branches "${VULNEX_BRANCHES}" \
            --enrich-limit "${{ github.event.inputs.enrich_limit || '5000' }}"

      # Optional: record the CVEs this scan found fixed in VulnerabilityData (opens a
      # pull request there). Needs a token with write access to that repository, saved
      # as the VULNEX_VULNDATA_TOKEN secret. It runs before the cleanup below so nothing
      # is deleted before it is recorded.
      - name: Publish fixed-CVE list to VulnerabilityData
        if: env.HAS_VULNDATA_TOKEN == 'true'
        continue-on-error: true
        working-directory: backend
        env:
          VULNEX_VULNDATA_TOKEN: ${{ secrets.VULNEX_VULNDATA_TOKEN }}
        run: python -m vulnex.cli fixed-cves --branch 3.0 --publish

      # Findings confirmed patched (spec patch + changelog) and already recorded in
      # VulnerabilityData's fixed-CVE ledger are dropped to save database space. The
      # ledger is read from the public repo; if it cannot be read, nothing is deleted.
      - name: Drop findings already recorded as fixed
        continue-on-error: true
        working-directory: backend
        run: python -m vulnex.cli prune-patched --branch 3.0

      # Optional: when the DATABASE_URL secret (Supabase connection string) exists,
      # refresh the scan tables there too. Triage data is never touched.
      - name: Sync snapshot to Postgres
        if: env.HAS_DB == 'true'
        # A database problem must never block committing the snapshot or the deploy.
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m vulnex.cli migrate-sqlite --only snapshot

      - name: Print snapshot summary
        working-directory: backend
        run: python -m vulnex.cli stats

      # The static GitHub Pages copy is optional (the live site is Netlify + Render).
      # It only runs when the repository variable ENABLE_PAGES is "true" AND Pages is set
      # to "GitHub Actions" in the repo settings; otherwise these steps are skipped and
      # the scan still finishes green.
      - name: Build static dashboard
        if: vars.ENABLE_PAGES == 'true'
        working-directory: backend
        run: python -m vulnex.cli export --out ../site

      - name: Commit refreshed snapshot
        run: |
          git config user.name "vulnex-bot"
          git config user.email "vulnex-bot@users.noreply.github.com"
          git add -f data/vulnex.db
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
          else
            git commit -m "chore: refresh CVE snapshot ($(date -u +%Y-%m-%d)) [skip ci]"
            # The branch can move while a scan runs (a merge, another snapshot). Replay
            # this snapshot on top of the latest commit and retry, instead of failing
            # with "failed to push some refs". The scan's database wins any conflict.
            for attempt in 1 2 3 4; do
              if git push; then break; fi
              if [ "$attempt" = 4 ]; then echo "push failed after 4 attempts"; exit 1; fi
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase -X theirs "origin/${GITHUB_REF_NAME}"
              sleep $((attempt * 3))
            done
          fi

      - uses: actions/configure-pages@v5
        if: vars.ENABLE_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PAGES == 'true'
        with:
          path: site

  deploy:
    name: Deploy dashboard
    needs: scan
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
