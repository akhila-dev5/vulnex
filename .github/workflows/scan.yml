name: VULNEX scan

# Runs on a schedule, on demand, and never on a bot push (the snapshot commit is
# marked [skip ci]) so the workflow cannot loop on itself.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      branches:
        description: "Comma-separated branches to scan"
        default: "3.0-dev,fasttrack/3.0"
      enrich_limit:
        description: "Max CVEs to enrich from NVD/MITRE/Red Hat/GHSA"
        default: "400"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vulnex-scan
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend
      - name: Run scanner tests
        run: python -m pytest -q
        working-directory: backend

  scan:
    name: Scan Azure Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run VULNEX scan
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          VULNEX_BRANCHES: ${{ github.event.inputs.branches || '3.0-dev,fasttrack/3.0' }}
        run: |
          python -m vulnex.cli scan \
            --branches "${VULNEX_BRANCHES}" \
            --enrich-limit "${{ github.event.inputs.enrich_limit || '400' }}"

      - name: Print snapshot summary
        working-directory: backend
        run: python -m vulnex.cli stats

      - name: Build static dashboard
        working-directory: backend
        run: python -m vulnex.cli export --out ../site

      - name: Commit refreshed snapshot
        run: |
          git config user.name "vulnex-bot"
          git config user.email "vulnex-bot@users.noreply.github.com"
          git add -f data/vulnex.db
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
          else
            git commit -m "chore: refresh CVE snapshot ($(date -u +%Y-%m-%d)) [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy dashboard
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
